# Cluster Cooperation profile layer. Apply after dsh-base so Agent Teams,
# declarative cluster configuration, and role-based model routing are all
# mounted, and so direct delegation goes through the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: cluster-config
      name: '@deepseek-ai/dsh-cluster-config'

    - id: cluster-router
      name: '@deepseek-ai/dsh-cluster-router'

    - id: cluster-orchestrator
      name: '@deepseek-ai/dsh-cluster-orchestrator'
